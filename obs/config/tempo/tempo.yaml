# Single-binary Tempo on local disk. The metrics generator derives request
# rate/latency per span (span metrics) and the service graph from traces,
# and remote-writes them to Prometheus with exemplars that link back here.

stream_over_http_enabled: true

server:
  http_listen_port: 3200
  grpc_listen_port: 9096 # 9095 is left free; 4317/4318 belong to the collector
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 127.0.0.1:4417

metrics_generator:
  # A client span whose target isn't traced (e.g. the ECS metadata endpoint)
  # still becomes a service-map node, named by the first attribute found.
  # server.address is added to the defaults so plain HTTP calls qualify.
  processor:
    service_graphs:
      peer_attributes:
        - peer.service
        - db.name
        - db.system
        - db.system.name
        - server.address
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://127.0.0.1:9090/api/v1/write
        send_exemplars: true

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

overrides:
  defaults:
    metrics_generator:
      processors: ["span-metrics", "service-graphs"]

usage_report:
  reporting_enabled: false
