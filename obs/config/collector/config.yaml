# OpenTelemetry Collector: the single entry point for telemetry. Apps send
# OTLP here; the collector batches it and fans out by signal type. Every
# backend runs in the same ECS task, so they're all reached on localhost.
#
#   traces  -> Tempo       (OTLP gRPC, :4417)
#   metrics -> Prometheus  (OTLP HTTP receiver)
#   logs    -> Loki        (OTLP HTTP endpoint)

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Drop data rather than crash if a backend stalls and queues fill up.
  memory_limiter:
    check_interval: 1s
    limit_mib: 200
    spike_limit_mib: 50
  batch: {}

exporters:
  otlp/tempo:
    endpoint: 127.0.0.1:4417
    tls:
      insecure: true
  otlphttp/prometheus:
    endpoint: http://127.0.0.1:9090/api/v1/otlp
  otlphttp/loki:
    endpoint: http://127.0.0.1:3100/otlp

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/loki]

  # The collector's own health (accepted/refused/dropped items, queue sizes),
  # scraped by Prometheus like every other component.
  telemetry:
    logs:
      level: warn
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
