# Prometheus receives app metrics over OTLP (pushed by the collector) and
# span metrics from Tempo over remote write. It scrapes every component of
# the monitoring stack, itself included, so the stack is monitored too.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Resource attributes copied onto every OTLP series as labels, so dashboards
# can filter by version, task and availability zone.
otlp:
  promote_resource_attributes:
    - service.name
    - service.version
    - service.instance.id
    - deployment.environment.name
    - cloud.availability_zone
    - aws.ecs.task.arn

storage:
  tsdb:
    # OTLP batches can arrive slightly out of order.
    out_of_order_time_window: 30m

rule_files:
  - /etc/obs/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
        labels: { component: prometheus }

  - job_name: otel-collector
    static_configs:
      - targets: ["127.0.0.1:8888"]
        labels: { component: otel-collector }

  - job_name: loki
    static_configs:
      - targets: ["127.0.0.1:3100"]
        labels: { component: loki }

  - job_name: tempo
    static_configs:
      - targets: ["127.0.0.1:3200"]
        labels: { component: tempo }

  - job_name: grafana
    static_configs:
      - targets: ["127.0.0.1:3000"]
        labels: { component: grafana }
