# Prometheus receives app metrics over OTLP (pushed by the collector) and
# span metrics from Tempo over remote write. It scrapes every component of
# the monitoring stack, itself included, so the stack is monitored too.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

# OTLP resource attributes (service, version, ECS task, availability zone,
# container name...) become labels on every series, so dashboards can split
# by task or service. Per-container timestamps and IDs are left out: they
# change on every restart and would only multiply series.
otlp:
  promote_all_resource_attributes: true
  ignore_resource_attributes:
    - aws.ecs.task.pull_started_at
    - aws.ecs.task.pull_stopped_at
    - aws.ecs.task.known_status
    - aws.ecs.container.started_at
    - aws.ecs.container.finished_at
    - aws.ecs.container.created_at
    - aws.ecs.container.know_status
    - aws.ecs.container.exit_code
    - aws.ecs.container.image.id
    - aws.ecs.docker.name
    - container.id
    - process.pid
    - process.command_args
    - process.command_line
    - process.executable.path

storage:
  tsdb:
    # OTLP batches can arrive slightly out of order.
    out_of_order_time_window: 30m

rule_files:
  - /etc/obs/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
        labels: { component: prometheus }

  - job_name: otel-collector
    static_configs:
      - targets: ["127.0.0.1:8888"]
        labels: { component: otel-collector }

  - job_name: loki
    static_configs:
      - targets: ["127.0.0.1:3100"]
        labels: { component: loki }

  - job_name: tempo
    static_configs:
      - targets: ["127.0.0.1:3200"]
        labels: { component: tempo }

  - job_name: grafana
    static_configs:
      - targets: ["127.0.0.1:3000"]
        labels: { component: grafana }
