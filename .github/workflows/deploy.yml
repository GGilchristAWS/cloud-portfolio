# Build and push main's images, publish the static resume, and deploy the
# demo. The demo runs on demand, so a push applies only while it's up; a
# workflow_dispatch (the resume page's launcher, or Actions -> Deploy -> Run
# workflow) always applies, bringing it up.
name: Deploy

on:
  push:
    branches: [main]
    paths:
      - app/**
      - infra/**
      - obs/**
      - scripts/component-tags.sh
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read

# Shared with teardown.yml so the two never touch the app stack at once.
concurrency:
  group: app-stack
  cancel-in-progress: false

env:
  TF_VERSION: 1.16.5
  TF_IN_AUTOMATION: "1"
  UV_VERSION: 0.13.0

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-24.04
    # The deploy role trusts only this environment, which only main may use.
    environment:
      name: production
      url: ${{ steps.apply.outputs.app_url }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # component tags come from history

      # Each component is tagged with the last commit that changed it, so a
      # dashboard edit doesn't roll the app tasks and an app change doesn't
      # restart the monitoring task (whose data is task-local until Phase 5).
      - name: Compute component tags
        id: tags
        run: |
          scripts/component-tags.sh | tee -a "$GITHUB_OUTPUT"
          scripts/component-tags.sh | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      # Tags are immutable, so an unchanged component reuses its image.
      - name: Check for existing image
        id: image
        env:
          IMAGE_TAG: ${{ steps.tags.outputs.app }}
        run: |
          if aws ecr describe-images --repository-name "${{ vars.ECR_REPOSITORY }}" \
               --image-ids imageTag="$IMAGE_TAG" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.image.outputs.exists == 'false'

      - name: Get build time
        if: steps.image.outputs.exists == 'false'
        id: meta
        run: echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # Single-manifest image: no attestations (see bootstrap/ecr.tf).
      - name: Build and push image
        if: steps.image.outputs.exists == 'false'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ steps.tags.outputs.app }}
          build-args: |
            GIT_SHA=${{ steps.tags.outputs.app }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}
            APP_VERSION=0.1.0
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Configs and dashboards for the monitoring task, tagged independently.
      - name: Check for existing observability config image
        id: obs_image
        env:
          IMAGE_TAG: ${{ steps.tags.outputs.obs }}
        run: |
          if aws ecr describe-images --repository-name "${{ vars.ECR_REPOSITORY }}-obs-config" \
               --image-ids imageTag="$IMAGE_TAG" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.image.outputs.exists == 'true' && steps.obs_image.outputs.exists == 'false'

      - name: Build and push observability config image
        if: steps.obs_image.outputs.exists == 'false'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: obs
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}-obs-config:${{ steps.tags.outputs.obs }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # Images are built either way, so the next launch deploys this commit.
      - name: Decide whether to apply
        id: target
        working-directory: infra
        run: |
          terraform init -input=false
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || [ -n "$(terraform state list)" ]; then
            echo "apply=true" >> "$GITHUB_OUTPUT"
          else
            echo "apply=false" >> "$GITHUB_OUTPUT"
            echo "The demo is down, so this push only built images." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Set before anything is created, so a deploy that fails halfway is
      # still torn down. A launch from the resume page has already set it; the
      # Keep up workflow cancels it.
      - name: Set the teardown timer
        if: github.event_name == 'workflow_dispatch'
        env:
          LAUNCHER_FUNCTION: ${{ vars.LAUNCHER_FUNCTION }}
        run: scripts/launcher-action.sh ensure_teardown

      - name: terraform apply
        id: apply
        if: steps.target.outputs.apply == 'true'
        working-directory: infra
        env:
          TF_VAR_image_tag: ${{ steps.tags.outputs.app }}
          TF_VAR_obs_config_tag: ${{ steps.tags.outputs.obs }}
        run: |
          terraform init -input=false
          terraform plan -input=false -no-color -out=tfplan
          terraform apply -input=false -no-color tfplan
          echo "app_url=$(terraform output -raw app_url)" >> "$GITHUB_OUTPUT"
          echo "grafana_url=$(terraform output -raw grafana_url)" >> "$GITHUB_OUTPUT"

      # The service only reaches steady state once the new task is healthy, but
      # confirm the load balancer is actually serving the app's commit.
      - name: Smoke test
        if: steps.target.outputs.apply == 'true'
        env:
          APP_URL: ${{ steps.apply.outputs.app_url }}
          IMAGE_TAG: ${{ steps.tags.outputs.app }}
        run: |
          for attempt in $(seq 1 20); do
            served=$(curl -fsS --max-time 5 "$APP_URL/version" | jq -r .commit || true)
            if [ "$served" = "$IMAGE_TAG" ]; then
              echo "Serving $IMAGE_TAG at $APP_URL"
              echo "Deployed \`$IMAGE_TAG\` to $APP_URL" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Attempt $attempt: serving '${served:-nothing}', waiting..."
            sleep 15
          done
          echo "::error::$APP_URL is not serving $IMAGE_TAG"
          exit 1

      # A minute of k6 traffic through the load balancer, with latency and
      # error thresholds, so an upgrade that slows or breaks the app fails
      # its deploy instead of only showing up on the dashboards.
      - name: k6 smoke test
        if: steps.target.outputs.apply == 'true'
        env:
          LOAD_TEST_TOKEN: ${{ secrets.LOAD_TEST_TOKEN }}
          BASE_URL: ${{ steps.apply.outputs.app_url }}
        run: |
          loadtest/run.sh smoke
          cat loadtest/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test Grafana
        if: steps.target.outputs.apply == 'true'
        env:
          GRAFANA_URL: ${{ steps.apply.outputs.grafana_url }}
        run: |
          for attempt in $(seq 1 20); do
            if curl -fsS --max-time 5 "$GRAFANA_URL/api/health" > /dev/null; then
              echo "Grafana is up at $GRAFANA_URL"
              echo "Dashboards: $GRAFANA_URL" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Attempt $attempt: Grafana not ready, waiting..."
            sleep 15
          done
          echo "::error::Grafana is not healthy at $GRAFANA_URL"
          exit 1

      # The telemetry path end to end: the monitoring task's background traffic
      # (obs/config/k6/ambient.js) goes through the load balancer to the app,
      # whose metrics reach Prometheus through the collector. A break anywhere
      # (a container that won't start, Service Connect, the collector) fails
      # here instead of leaving the dashboards quietly empty.
      - name: Check background traffic reaches the dashboards
        if: steps.target.outputs.apply == 'true'
        env:
          GRAFANA_URL: ${{ steps.apply.outputs.grafana_url }}
        run: |
          query='sum(rate(load_test_requests_total{scenario="ambient"}[1m]))'
          for attempt in $(seq 1 20); do
            rate=$(curl -fsS --max-time 5 -G "$GRAFANA_URL/api/datasources/proxy/uid/prometheus/api/v1/query" \
                     --data-urlencode "query=$query" | jq -r '.data.result[0].value[1] // "0"' || echo 0)
            if awk -v r="$rate" 'BEGIN { exit !(r > 0.5) }'; then
              echo "Background traffic reaches the dashboards: $rate req/s" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Attempt $attempt: ${rate} req/s of background traffic, waiting..."
            sleep 15
          done
          echo "::error::No background traffic in Prometheus; check the monitoring task's traffic container"
          exit 1

  # The always-on resume (bootstrap/site.tf), rendered from the app's templates.
  site:
    name: Publish the static resume
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Build the page
        working-directory: app
        run: |
          uv sync --locked --no-dev
          uv run --no-sync python scripts/build_site.py "$RUNNER_TEMP/site"

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload and clear the CDN cache
        env:
          SITE_BUCKET: ${{ vars.SITE_BUCKET }}
          SITE_DISTRIBUTION: ${{ vars.SITE_DISTRIBUTION }}
        run: |
          aws s3 sync "$RUNNER_TEMP/site" "s3://$SITE_BUCKET" --delete --exclude resume --cache-control "max-age=300"
          # The app served the resume at /resume, so links to it are out there.
          aws s3 cp "$RUNNER_TEMP/site/index.html" "s3://$SITE_BUCKET/resume" \
            --content-type "text/html; charset=utf-8" --cache-control "max-age=300"
          aws cloudfront create-invalidation --distribution-id "$SITE_DISTRIBUTION" --paths "/*" > /dev/null
          echo "Published the resume to https://portfolio.geoffgilchrist.com" >> "$GITHUB_STEP_SUMMARY"

      # The page as a visitor sees it: its script must get an answer from the
      # launcher (CloudFront -> Lambda -> GitHub). GETs don't count as launches.
      - name: Check the page and the launcher
        working-directory: app
        run: |
          uv run --no-sync --with playwright==1.55.0 playwright install --with-deps chromium
          panel=$(uv run --no-sync --with playwright==1.55.0 python scripts/check_site.py https://portfolio.geoffgilchrist.com)
          echo "$panel"
          echo "$panel" >> "$GITHUB_STEP_SUMMARY"
