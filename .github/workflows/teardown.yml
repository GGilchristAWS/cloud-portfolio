# Cost guardrail: destroy the app stack every night so a forgotten demo costs
# at most a day. Bring it back with the Deploy workflow (Run workflow).
# The bootstrap stack (state, ECR, budgets, roles) is never touched.
name: Teardown

on:
  schedule:
    - cron: "0 7 * * *" # 07:00 UTC = midnight Pacific (daylight time)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-stack
  cancel-in-progress: false

env:
  TF_VERSION: 1.16.5
  TF_IN_AUTOMATION: "1"

jobs:
  teardown:
    name: Destroy app stack
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform destroy
        working-directory: infra
        env:
          TF_VAR_image_tag: unused-for-destroy
        run: |
          terraform init -input=false
          if [ -z "$(terraform state list)" ]; then
            echo "App stack is already down." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          terraform destroy -input=false -no-color -auto-approve
          echo "App stack destroyed." >> "$GITHUB_STEP_SUMMARY"
