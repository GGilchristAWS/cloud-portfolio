<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Geoffrey Gilchrist · Cloud Operations{% endblock %}</title>
  <style>
    :root {
      --bg: #f7f7f5; --fg: #1d1d1b; --muted: #5f5f5a; --card: #ffffff;
      --line: #e3e3de; --accent: #c2410c;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141413; --fg: #ecebe6; --muted: #a3a29b; --card: #1e1e1c;
        --line: #33332f; --accent: #fb923c;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--fg);
      font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { max-width: 860px; margin: 0 auto; padding: 24px 16px 64px; }
    nav { display: flex; gap: 20px; margin-bottom: 32px; font-size: 0.95rem; }
    nav a { color: var(--muted); text-decoration: none; }
    nav a[aria-current="page"] { color: var(--fg); font-weight: 600; }
    h1 { font-size: 2.2rem; line-height: 1.2; margin: 0 0 8px; }
    h2 { font-size: 1.15rem; margin: 40px 0 12px; }
    .lede { color: var(--muted); font-size: 1.1rem; margin: 0; }
    a { color: var(--accent); }
    .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
    .card h3 { margin: 0 0 4px; font-size: 1rem; }
    .card p { margin: 0; color: var(--muted); font-size: 0.95rem; }
    ol.flow { padding-left: 20px; margin: 0; }
    ol.flow li { margin-bottom: 4px; }
    dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; margin: 0; }
    dt { color: var(--muted); }
    dd { margin: 0; font-family: ui-monospace, "Cascadia Code", monospace; overflow-wrap: anywhere; }
    footer { margin-top: 48px; color: var(--muted); font-size: 0.9rem; }
    {% block styles %}{% endblock %}

    /* Printing (or "Save as PDF") drops the site chrome and dark theme. */
    @media print {
      :root { --bg: #fff; --fg: #000; --muted: #333; --card: #fff; --line: #ccc; --accent: #000; }
      body { font-size: 10.5pt; line-height: 1.4; }
      main { max-width: none; padding: 0; }
      nav, footer, .no-print { display: none; }
      a { text-decoration: none; }
      h2 { margin-top: 18px; }
    }
  </style>
</head>
<body>
<main>
  <nav aria-label="Site">
    <a href="/" {% if page == "home" %}aria-current="page"{% endif %}>Home</a>
    <a href="/resume" {% if page == "resume" %}aria-current="page"{% endif %}>Resume</a>
    <a href="{{ grafana_url }}">Live dashboards</a>
    <a href="{{ repo_url }}">Source</a>
  </nav>
  {% block content %}{% endblock %}
  <footer>Source and architecture: <a href="{{ repo_url }}">{{ repo_url }}</a></footer>
</main>
</body>
</html>
